# Source registry for the Wattle Health pipeline. Mirrors the `sources` table
# (supabase/migrations/0001_schema.sql) and RESEARCH-PLAN.md sections 2 to 5.
# kind: register | open_data | api | licensed | scrape | declared | platform
# legal_basis: a string citing the licence / agreement / statutory list / public-facts
#   case, or TODO-founder when an agreement is still to be signed. An adapter
#   without a string legal basis does not run (DATA-MODEL.md).
# status: live (adapter runs today) | skeleton | planned | excluded

sources:
  # ---------------------------------------------------------------- spine (RESEARCH-PLAN section 2)
  - id: ahpra_extract
    name: Ahpra Medical Board register extract (specialist registrations, fields, endorsements, status, languages, PPP postcode)
    kind: licensed
    cadence: quarterly
    url: https://www.ahpra.gov.au/About-Ahpra/What-We-Do/Data-access-and-research.aspx
    legal_basis: TODO-founder (A3: Ahpra external data exchange agreement, ~$2,000 per extract; never scrape the register)
    status: planned
  - id: ahpra_pie
    name: Ahpra Practitioner Information Exchange (daily status alerts, on-demand verification)
    kind: api
    cadence: daily
    url: https://www.ahpra.gov.au/Registration/Practitioner-Information-Exchange.aspx
    legal_basis: TODO-founder (A4: PIE agreement, $1 per practitioner per year; claimed profiles only)
    status: planned
  - id: nhsd
    name: National Health Services Directory (healthdirect) Data and API Licence with bulk export
    kind: licensed
    cadence: nightly
    url: https://about.healthdirect.gov.au/nhsd
    legal_basis: TODO-founder (A1: NHSD Data and API Licence; "consumer-facing directory" in the approved purpose)
    status: planned
  - id: pca
    name: Provider Connect Australia (ADHA) business partner feed
    kind: api
    cadence: push
    url: https://www.digitalhealth.gov.au/healthcare-providers/initiatives-and-programs/provider-connect-australia
    legal_basis: TODO-founder (A2: PCA participation agreement)
    status: planned
  - id: abr_bulk
    name: ABN Bulk Extract (Australian Business Register)
    kind: open_data
    cadence: weekly
    url: https://data.gov.au/data/dataset/abn-bulk-extract
    legal_basis: CC BY 3.0 AU (data.gov.au ABN Bulk Extract; checked 2026-10-15)
    adapter: pipeline/adapters/abr_bulk.py
    status: live
  - id: abs_asgs
    name: ABS ASGS Edition 3 boundaries (SA2, SA3, LGA, state)
    kind: open_data
    cadence: on-release
    url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs-edition-3/jul2021-jun2026/access-and-downloads/digital-boundary-files
    legal_basis: CC BY 4.0 (ABS)
    status: planned
  - id: mmm_2023
    name: Modified Monash Model 2023 and GP Catchments
    kind: open_data
    cadence: on-release
    url: https://www.health.gov.au/resources/publications/modified-monash-model-fact-sheet
    legal_basis: CC BY 2.5 AU (Department of Health, data.gov.au)
    status: planned
  - id: phn_boundaries
    name: Primary Health Network boundaries
    kind: open_data
    cadence: on-release
    url: https://www.health.gov.au/resources/publications/primary-health-networks-phn-boundaries
    legal_basis: CC BY 4.0 (Department of Health)
    status: planned

